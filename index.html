<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אתגר 14 ימים</title>
<meta name="theme-color" content="#14203a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אתגר">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap">
<style>
:root {
  --bg: #edf0f5; --surface: #ffffff; --ink: #14203a; --muted: #56627c; --line: #d3d9e4;
  --accent: #d9441f; --on-accent: #ffffff; --ok: #0c8a80;
  --font-body: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-display: "Secular One", "Heebo", system-ui, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1422; --surface: #172036; --ink: #e8ecf6; --muted: #9aa6bf; --line: #2a3550; --accent: #ff7a57; --on-accent: #0e1422; --ok: #35c4b6; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 24px; padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
/* בלי זה פס הימים (14 כפתורים ברוחב קבוע) מרחיב את הדף מעבר למסך ומאלץ גלילה אופקית בטלפון. */
.wrap > *, .wrap section > * { min-width: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.05; }
h2 { font-size: 1.2rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.top { display: grid; gap: 6px; }
.eyebrow { color: var(--muted); font-size: .85rem; letter-spacing: .04em; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
.who b { color: var(--ink); }
.linkbtn { background: none; border: 0; padding: 6px 0; text-decoration: underline; cursor: pointer; color: var(--muted); }
.chip { font-size: .8rem; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip.warn { color: var(--accent); border-color: var(--accent); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: .85rem; }
.strip { display: flex; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; min-width: 0; padding-bottom: 6px; scroll-snap-type: x proximity; }
.d { flex: 0 0 52px; scroll-snap-align: center; display: grid; gap: 4px; justify-items: center; padding: 8px 2px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.d:disabled { opacity: .45; cursor: default; }
.d[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.d .wd { font-size: .72rem; color: var(--muted); }
.d .dn { font-family: var(--font-display); font-size: 1.15rem; line-height: 1; }
.d.today .dn::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); margin: 3px auto 0; }
.bar { width: 34px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.rules { display: grid; gap: 10px; }
.rule { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 10px 14px; text-align: right; background: transparent; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; }
.rule:disabled { cursor: default; opacity: .6; }
.rule .big { font-family: var(--font-display); font-size: 1.6rem; min-width: 3.4ch; text-align: center; direction: ltr; unicode-bidi: isolate; line-height: 1; flex: none; }
.rule .txt { display: grid; flex: 1; min-width: 0; }
.rule .txt b { font-weight: 700; font-size: 1.05rem; }
.rule .txt span { color: var(--muted); font-size: .85rem; }
.rule .tick { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: var(--on-accent); }
.rule .tick svg { width: 20px; height: 20px; opacity: 0; }
.rule.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rule.on .tick { background: var(--accent); border-color: var(--accent); }
.rule.on .tick svg { opacity: 1; }
.rule:focus-visible, .d:focus-visible, .linkbtn:focus-visible, .pick:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.prog { font-weight: 500; }
.perfect { color: var(--ok); font-weight: 700; }
.board { display: grid; gap: 8px; }
.p { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.p.me { border-color: var(--accent); }
.p .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p .sub { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.score { font-family: var(--font-display); font-size: 1.3rem; min-width: 3.2ch; text-align: left; font-variant-numeric: tabular-nums; }
.score small { font-family: var(--font-body); font-size: .75rem; color: var(--muted); }
.install { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; color: var(--muted); font-size: .9rem; display: grid; gap: 8px; }
.install button.act { justify-self: start; padding: 10px 16px; border-radius: 6px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; font-weight: 700; }
#picker { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; align-content: safe center; padding: 24px max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
#picker[hidden] { display: none; }
#picker .box { max-width: 420px; margin: 0 auto; width: 100%; display: grid; gap: 16px; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pick { min-height: 56px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .2s ease; } .rule, .rule .tick { transition: background .15s ease, border-color .15s ease; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <p class="eyebrow" id="range"></p>
    <h1 id="title">אתגר 14 ימים</h1>
    <div class="who">
      <span>מסמנ/ת בתור <b id="me"></b></span>
      <button class="linkbtn" id="change" type="button">החלפת שם</button>
      <span class="chip" id="sync">טוען</span>
    </div>
  </header>

  <section aria-label="בחירת יום">
    <div class="sec-head"><h2>הימים</h2><span class="hint">אפשר להשלים ימים שעברו</span></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="card" id="today" aria-label="הסימונים שלי"></section>

  <section aria-label="הקבוצה">
    <div class="sec-head"><h2>הקבוצה</h2><span class="hint" id="groupHint"></span></div>
    <div class="board" id="board"></div>
  </section>

  <section class="install" id="install" hidden></section>
</main>

<div id="picker" role="dialog" aria-modal="true" aria-label="בחירת שם" hidden>
  <div class="box">
    <h1>מי את/ה?</h1>
    <p class="hint">הבחירה נשמרת בטלפון הזה. אפשר להחליף אחר כך.</p>
    <div class="picks" id="picks"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
