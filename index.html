<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אתגר 14 ימים</title>
<meta name="theme-color" content="#ffd33b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אתגר">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Suez+One&display=swap">
<style>
:root {
  --bg: #f1ecfb;
  --surface: #ffffff;
  --sunk: #e7dff8;
  --ink: #1d1240;
  --muted: #6b5b94;
  --line: #1d1240;
  --accent: #ffd33b;
  --on-accent: #1d1240;
  --ok: #00846b;
  --r1: #2f5fff;
  --r2: #e5215f;
  --r3: #ef6c00;
  --r4: #00868f;
  --r5: #6f3fe0;
  --lift: 4px;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-display: "Suez One", "Rubik", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17102f;
    --surface: #251a4d;
    --sunk: #1c1339;
    --ink: #f6f1ff;
    --muted: #a898d6;
    --line: #6d55c0;
    --accent: #ffd33b;
    --on-accent: #1d1240;
    --ok: #39d6ab;
    --r1: #7b9bff;
    --r2: #ff6d93;
    --r3: #ffa64d;
    --r4: #3fd0d9;
    --r5: #b298ff;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
p { margin: 0; }

.wrap {
  max-width: 540px;
  margin: 0 auto;
  display: grid;
  gap: 26px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(44px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
/* בלי זה פס הימים (14 כפתורים ברוחב קבוע) מרחיב את הדף מעבר למסך ומאלץ זום-אאוט בטלפון. */
.wrap > *, .wrap section > * { min-width: 0; }

h1, h2, .num { font-family: var(--font-display); font-weight: 400; margin: 0; letter-spacing: 0; }
h1 { font-size: clamp(2.1rem, 10vw, 3rem); line-height: .98; }
h2 { font-size: 1.15rem; line-height: 1.1; }

/* ---------- כותרת ---------- */
.hero {
  background: var(--accent);
  color: var(--on-accent);
  border: 3px solid var(--line);
  border-radius: 20px;
  box-shadow: calc(var(--lift) * -1) var(--lift) 0 var(--line);
  padding: 16px 18px 14px;
  display: grid;
  gap: 8px;
}
.hero .dates { font-size: .85rem; font-weight: 500; opacity: .75; }
.hero .tally { font-size: .95rem; font-weight: 500; max-width: 34ch; }
.hero .tally b { font-weight: 900; }
.whoami {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 2px;
  font-size: .9rem;
}
.tag {
  background: var(--on-accent);
  color: var(--accent);
  border-radius: 999px;
  padding: 4px 12px;
  font-weight: 700;
}
.linkbtn {
  background: none;
  border: 0;
  padding: 8px 2px;
  min-height: 44px;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-weight: 500;
  font-size: .9rem;
}
.hero .linkbtn { color: var(--on-accent); }
.chip {
  font-size: .78rem;
  font-weight: 500;
  padding: 3px 10px;
  border: 2px solid currentColor;
  border-radius: 999px;
  opacity: .8;
}
.chip.warn { background: var(--on-accent); color: var(--accent); border-color: var(--on-accent); opacity: 1; }

/* ---------- כותרות מקטע ---------- */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: .85rem; }

/* ---------- פס הימים ---------- */
.strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  min-width: 0;
  padding: 2px 2px 10px;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.d {
  flex: 0 0 56px;
  scroll-snap-align: center;
  display: grid;
  gap: 5px;
  justify-items: center;
  padding: 7px 4px 8px;
  background: var(--surface);
  color: var(--ink);
  border: 2.5px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
}
.d:disabled { background: var(--sunk); border-style: dashed; color: var(--muted); cursor: default; }
.d.today { background: var(--accent); color: var(--on-accent); border-color: var(--line); }
.d[aria-current="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--line); }
.d .wd { font-size: .7rem; font-weight: 500; opacity: .75; }
.d .dn { font-family: var(--font-display); font-size: 1.3rem; line-height: 1; }
.pips { display: flex; gap: 2.5px; }
.pips i { width: 6px; height: 6px; border-radius: 2px; background: currentColor; opacity: .22; }
.pips i.on { opacity: 1; }
.pips i.c1 { color: var(--r1); } .pips i.c2 { color: var(--r2); } .pips i.c3 { color: var(--r3); }
.pips i.c4 { color: var(--r4); } .pips i.c5 { color: var(--r5); }

/* ---------- הכללים ---------- */
.day-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.prog { font-weight: 700; font-size: .95rem; }
.prog.perfect { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; color: var(--ok); }
.rules { display: grid; gap: 10px; }
.rule {
  --c: var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 66px;
  padding: 10px 14px;
  text-align: right;
  background: var(--surface);
  border: 3px solid var(--line);
  border-radius: 16px;
  box-shadow: calc(var(--lift) * -1) var(--lift) 0 var(--line);
  cursor: pointer;
}
.rule.c1 { --c: var(--r1); } .rule.c2 { --c: var(--r2); } .rule.c3 { --c: var(--r3); }
.rule.c4 { --c: var(--r4); } .rule.c5 { --c: var(--r5); }
.rule .big {
  font-family: var(--font-display);
  font-size: 1.55rem;
  color: var(--c);
  min-width: 3.3ch;
  text-align: center;
  direction: ltr;
  unicode-bidi: isolate;
  line-height: 1;
  flex: none;
}
.rule .txt { display: grid; flex: 1; min-width: 0; }
.rule .txt b { font-weight: 700; font-size: 1.02rem; }
.rule .txt span { color: var(--muted); font-size: .82rem; }
.rule .tick {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 3px solid var(--line);
  background: var(--sunk);
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
}
.rule .tick svg { width: 20px; height: 20px; opacity: 0; transform: scale(.4); }
.rule.on { background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.rule.on .tick { background: var(--c); border-color: var(--c); }
.rule.on .tick svg { opacity: 1; transform: scale(1); }
.rule:active { transform: translate(-2px, 2px); box-shadow: calc(var(--lift) * -0.5) calc(var(--lift) * 0.5) 0 var(--line); }
.rule:disabled { box-shadow: none; border-style: dashed; background: var(--sunk); cursor: default; }
.rule:disabled .big, .rule:disabled .txt b { color: var(--muted); }
.locked { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }

/* ---------- לוח הקבוצה ---------- */
.board { display: grid; gap: 8px; }
.p {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "rank name score" "rank meter score";
  align-items: center;
  column-gap: 11px;
  row-gap: 5px;
  padding: 10px 12px;
  background: var(--surface);
  border: 2.5px solid var(--line);
  border-radius: 14px;
}
.p.me { border-width: 3px; box-shadow: calc(var(--lift) * -1) var(--lift) 0 var(--line); }
.p .rank {
  grid-area: rank;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  border: 2.5px solid var(--line);
  background: var(--sunk);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 1rem;
  line-height: 1;
}
.p.lead .rank { background: var(--accent); color: var(--on-accent); }
.p .nm { grid-area: name; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p .nm em { font-style: normal; font-weight: 400; color: var(--muted); font-size: .82rem; }
.p .meter { grid-area: meter; display: flex; align-items: center; gap: 9px; }
.p .bar { flex: 1; min-width: 0; height: 7px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.p .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.p.lead .bar i { background: var(--r2); }
.dots { display: flex; gap: 3px; flex: none; }
.dots i { width: 9px; height: 9px; border-radius: 3px; background: currentColor; opacity: .2; }
.dots i.on { opacity: 1; }
.dots i.c1 { color: var(--r1); } .dots i.c2 { color: var(--r2); } .dots i.c3 { color: var(--r3); }
.dots i.c4 { color: var(--r4); } .dots i.c5 { color: var(--r5); }
.p .score { grid-area: score; font-family: var(--font-display); font-size: 1.4rem; line-height: 1; text-align: left; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.p .score small { font-family: var(--font-body); font-size: .72rem; font-weight: 500; color: var(--muted); }

/* ---------- פיד הפעילות ---------- */
.feed { display: grid; gap: 7px; }
.ev {
  --c: var(--line);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  padding: 9px 12px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-right: 7px solid var(--c);
  border-radius: 12px;
}
.ev.c1 { --c: var(--r1); } .ev.c2 { --c: var(--r2); } .ev.c3 { --c: var(--r3); }
.ev.c4 { --c: var(--r4); } .ev.c5 { --c: var(--r5); }
.ev.off { background: var(--sunk); border-style: dashed; }
.ev .mk { width: 20px; height: 20px; color: var(--c); flex: none; }
.ev.off .mk { color: var(--muted); }
.ev .mk svg { width: 100%; height: 100%; }
.ev .what { overflow: hidden; }
.ev .what b { font-weight: 700; }
.ev .what .rl { font-weight: 500; }
.ev .what span { color: var(--muted); }
.ev.off .what { color: var(--muted); }
.ev.off .what .rl { text-decoration: line-through; text-decoration-thickness: 2px; }
.ev time { color: var(--muted); font-size: .78rem; font-weight: 500; white-space: nowrap; flex: none; }
.empty {
  border: 2.5px dashed var(--line);
  border-radius: 14px;
  padding: 18px 16px;
  color: var(--muted);
  font-size: .92rem;
  text-align: center;
}

/* ---------- התקנה ---------- */
.install {
  border: 2.5px dashed var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  font-size: .9rem;
  display: grid;
  gap: 8px;
  justify-items: start;
  color: var(--muted);
}
.install b { color: var(--ink); font-size: 1rem; }
.install button.act {
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 3px solid var(--line);
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: calc(var(--lift) * -1) var(--lift) 0 var(--line);
  cursor: pointer;
  font-weight: 700;
}
.install button.act:active { transform: translate(-2px, 2px); box-shadow: -2px 2px 0 var(--line); }

/* ---------- מסך הפתיחה ---------- */
#picker {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  align-content: safe center;
  padding: 28px max(18px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
#picker[hidden] { display: none; }
#picker .box { max-width: 420px; margin: 0 auto; width: 100%; display: grid; gap: 18px; }
#picker h1 { font-size: clamp(2.3rem, 12vw, 3.2rem); }
#picker .hint { color: var(--on-accent); opacity: .8; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.pick {
  --c: var(--ink);
  min-height: 60px;
  border-radius: 15px;
  border: 3px solid var(--ink);
  background: #fff;
  color: var(--ink);
  box-shadow: -4px 4px 0 var(--ink);
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  border-bottom-width: 7px;
  border-bottom-color: var(--c);
}
.pick.c1 { --c: var(--r1); } .pick.c2 { --c: var(--r2); } .pick.c3 { --c: var(--r3); }
.pick.c4 { --c: var(--r4); } .pick.c5 { --c: var(--r5); }
.pick.c6 { --c: #00846b; } .pick.c7 { --c: #c2185b; }
.pick:active { transform: translate(-2px, 2px); box-shadow: -2px 2px 0 var(--ink); }

.rule:focus-visible, .d:focus-visible, .pick:focus-visible, .linkbtn:focus-visible, .install button:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 3px;
}
#picker .pick:focus-visible { outline-color: var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  .rule, .rule .tick, .install button.act, .pick { transition: background .14s ease, border-color .14s ease, transform .1s ease, box-shadow .1s ease; }
  .rule .tick svg { transition: opacity .14s ease, transform .18s cubic-bezier(.2, 1.5, .4, 1); }
  .p .bar i { transition: width .25s ease; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="dates" id="range"></p>
    <h1 id="title">אתגר 14 ימים</h1>
    <p class="tally" id="tally"></p>
    <div class="whoami">
      <span class="tag" id="me"></span>
      <button class="linkbtn" id="change" type="button">החלפת שם</button>
      <span class="chip" id="sync">טוען</span>
    </div>
  </header>

  <section aria-label="בחירת יום">
    <div class="sec-head"><h2>הימים</h2><span class="hint">אפשר להשלים ימים שעברו</span></div>
    <div class="strip" id="strip"></div>
  </section>

  <section id="today" aria-label="הסימונים שלי"></section>

  <section aria-label="הקבוצה">
    <div class="sec-head"><h2>הקבוצה</h2><span class="hint" id="groupHint"></span></div>
    <div class="board" id="board"></div>
  </section>

  <section aria-label="פעילות">
    <div class="sec-head"><h2>מה קרה</h2><span class="hint" id="feedHint"></span></div>
    <div class="feed" id="feed" aria-live="polite"></div>
  </section>

  <section class="install" id="install" hidden></section>
</main>

<div id="picker" role="dialog" aria-modal="true" aria-label="בחירת שם" hidden>
  <div class="box">
    <h1>מי את/ה?</h1>
    <p class="hint">הבחירה נשמרת בטלפון הזה. אפשר להחליף אחר כך.</p>
    <div class="picks" id="picks"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
